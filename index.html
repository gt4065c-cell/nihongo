<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="referrer" content="no-referrer">
<meta name="viewport" content="width=device-width, initial-scale=1, minimum-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<script>
/* 터치 기기(휴대폰·태블릿) 또는 좁은 화면이면 모바일 화면으로 */
(function(){
  var coarse = window.matchMedia && matchMedia("(pointer:coarse)").matches;
  var touch = ("ontouchstart" in window) || (navigator.maxTouchPoints > 0);
  var narrow = Math.min(screen.width || 9999, window.innerWidth || 9999) <= 820;
  var isM = coarse || narrow || (touch && /Mobi|Android|iPhone|iPad|iPod|SamsungBrowser|KAKAOTALK|NAVER/i.test(navigator.userAgent));
  if (isM) document.documentElement.classList.add("m");
  /* 글자 크기 단계(사용자 선택 저장). 일반 브라우저(Chrome/Safari)는 인앱보다 글자가 작게 보여서 기본값을 키움 */
  var inApp = /KAKAOTALK|NAVER|Instagram|FBAN|FBAV|Line\/|DaumApps|wv\)/i.test(navigator.userAgent);
  window.FS_STEPS = [0.9, 1, 1.15, 1.3, 1.45];
  var u = null; try { u = parseFloat(localStorage.getItem("nh_fs")); } catch(e){}
  if (!u || window.FS_STEPS.indexOf(u) < 0) u = (isM && !inApp) ? 1.3 : 1;
  window.applyFs = function(v){ document.documentElement.style.setProperty("--u", v); window.FS_U = v; };
  window.cycleFs = function(){
    var i = window.FS_STEPS.indexOf(window.FS_U); var v = window.FS_STEPS[(i + 1) % window.FS_STEPS.length];
    window.applyFs(v); try { localStorage.setItem("nh_fs", v); } catch(e){}
    if (window.toast) toast("글자 크기 " + Math.round(v * 100) + "%");
  };
  window.applyFs(u);
  /* 두 손가락 확대·축소, 더블탭 확대 막기 */
  document.addEventListener("gesturestart", function(e){ e.preventDefault(); }, { passive:false });
  document.addEventListener("gesturechange", function(e){ e.preventDefault(); }, { passive:false });
  document.addEventListener("touchmove", function(e){ if (e.touches && e.touches.length > 1) e.preventDefault(); }, { passive:false });
})();
</script>
<title>にほんご 75</title>
<meta name="description" content="일본어 일상회화 핵심 75단어 · 75문장 문답형 학습 사이트 / Learn 75 essential Japanese words & sentences">
<meta name="theme-color" content="#f6f1e7">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans:wght@400;500;700;900&family=Noto+Sans+JP:wght@400;500;700&family=Noto+Sans+KR:wght@400;500;700;900&family=Noto+Serif+JP:wght@600;900&display=swap" rel="stylesheet">
<style>
:root{
  --u:1; --fs:var(--u); --min:0px;
  --paper:#f6f1e7; --paper2:#efe7d8; --card:#fffdf8; --ink:#1f1b16; --ink2:#5d554a; --ink3:#958b7c;
  --line:#e2d8c6; --red:#c8402c; --red-soft:#f6ddd5; --green:#2f7d5b; --green-soft:#d9efe3;
  --indigo:#2d3e6b; --indigo-soft:#dfe4f1; --gold:#c08a1e; --shadow:0 1px 0 rgba(31,27,22,.06),0 6px 20px -8px rgba(31,27,22,.18);
  --r:16px;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --paper:#17140f; --paper2:#211d17; --card:#221e18; --ink:#f1ebe0; --ink2:#c2b8a8; --ink3:#8b8172;
  --line:#3a342b; --red:#e2654f; --red-soft:#43231d; --green:#5cbf8f; --green-soft:#1d3a2c;
  --indigo:#a7b6e3; --indigo-soft:#262e45; --gold:#e0ad4a; --shadow:0 1px 0 rgba(0,0,0,.3),0 8px 24px -10px rgba(0,0,0,.6);
}}
:root[data-theme="dark"]{
  --paper:#17140f; --paper2:#211d17; --card:#221e18; --ink:#f1ebe0; --ink2:#c2b8a8; --ink3:#8b8172;
  --line:#3a342b; --red:#e2654f; --red-soft:#43231d; --green:#5cbf8f; --green-soft:#1d3a2c;
  --indigo:#a7b6e3; --indigo-soft:#262e45; --gold:#e0ad4a; --shadow:0 1px 0 rgba(0,0,0,.3),0 8px 24px -10px rgba(0,0,0,.6);
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--paper);color:var(--ink)}
body{font-family:"Noto Sans","Noto Sans KR","Noto Sans JP",system-ui,sans-serif;line-height:1.55;-webkit-font-smoothing:antialiased;min-height:100vh;padding-bottom:84px}
.jp{font-family:"Noto Sans JP","Noto Sans KR",sans-serif}
.serif{font-family:"Noto Serif JP",serif}
button{font:inherit;color:inherit;cursor:pointer}
.wrap{max-width:760px;margin:0 auto;padding:0 16px}

/* header */
header.top{position:sticky;top:0;z-index:20;background:color-mix(in srgb,var(--paper) 88%,transparent);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
header.top .wrap{display:flex;align-items:center;gap:10px;height:58px}
.brand{white-space:nowrap;flex:none;display:flex;align-items:center;gap:9px;font-weight:900;letter-spacing:-.02em;font-size:max(var(--min),calc(18px*var(--fs)));cursor:pointer}
.sun{width:22px;height:22px;border-radius:50%;background:var(--red);box-shadow:0 0 0 4px var(--red-soft)}
.brand small{font-weight:500;color:var(--ink3);font-size:max(var(--min),calc(12px*var(--fs)))}
.spacer{flex:1}
.pill{white-space:nowrap;min-width:0;max-width:46vw;overflow:hidden;cursor:pointer;display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--card);border-radius:999px;padding:5px 11px;font-size:max(var(--min),calc(13px*var(--fs)));font-weight:500}
.seg{flex:none;display:inline-flex;border:1px solid var(--line);border-radius:999px;overflow:hidden;background:var(--card)}
.seg button{border:0;background:transparent;padding:5px 10px;font-size:max(var(--min),calc(12px*var(--fs)));font-weight:700;color:var(--ink3)}
.seg button.on{background:var(--ink);color:var(--paper)}
.xp{color:var(--gold);font-weight:700}
#userName{overflow:hidden;text-overflow:ellipsis;max-width:22vw}
.sync-dot{flex:none;width:7px;height:7px;border-radius:50%;background:var(--ink3)}
.sync-dot.ok{background:var(--green)} .sync-dot.err{background:var(--red)}

/* bottom nav */
nav.tabs{position:fixed;bottom:0;left:0;right:0;z-index:20;background:var(--card);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom)}
nav.tabs .wrap{display:grid;grid-template-columns:repeat(4,1fr);height:64px}
nav.tabs button{border:0;background:none;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-size:max(var(--min),calc(11px*var(--fs)));font-weight:500;color:var(--ink3)}
nav.tabs button .ic{font-size:max(var(--min),calc(19px*var(--fs)));line-height:1}
nav.tabs button.on{color:var(--red)}

/* general */
h1,h2,h3{letter-spacing:-.02em;margin:0}
.hero{padding:26px 0 8px}
.hero h1{font-size:calc(clamp(24px,6vw,32px)*var(--fs));font-weight:900;line-height:1.2}
.hero h1 .accent{color:var(--red)}
.hero p{color:var(--ink2);margin:8px 0 0;font-size:max(var(--min),calc(14.5px*var(--fs)))}
.section-t{display:flex;align-items:baseline;justify-content:space-between;margin:26px 0 10px}
.section-t h2{font-size:max(var(--min),calc(16px*var(--fs)));font-weight:700}
.section-t span{font-size:max(var(--min),calc(12.5px*var(--fs)));color:var(--ink3)}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow)}
.muted{color:var(--ink3)}
.btn{border:0;border-radius:12px;padding:13px 18px;font-weight:700;font-size:max(var(--min),calc(15px*var(--fs)));background:var(--ink);color:var(--paper);transition:transform .08s}
.btn:active{transform:scale(.98)}
.btn.red{background:var(--red);color:#fff}
.btn.ghost{background:transparent;border:1px solid var(--line);color:var(--ink)}
.btn:disabled{opacity:.4;cursor:not-allowed}
.row{display:flex;gap:10px;align-items:center}

/* stats summary */
.kpis{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:16px}
.kpi{padding:14px}
.kpi b{display:block;font-size:max(var(--min),calc(22px*var(--fs)));font-weight:900;letter-spacing:-.02em}
.kpi span{font-size:max(var(--min),calc(12px*var(--fs)));color:var(--ink3)}

/* modes */
.modes{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}
.mode{text-align:left;padding:12px 13px;border:1.5px solid var(--line);background:var(--card);border-radius:13px}
.mode b{display:block;font-size:max(var(--min),calc(14px*var(--fs)))}
.mode span{font-size:max(var(--min),calc(12px*var(--fs)));color:var(--ink3)}
.mode.on{border-color:var(--red);background:var(--red-soft)}

/* groups */
.stage-label{font-size:max(var(--min),calc(12px*var(--fs)));font-weight:700;color:var(--ink3);margin:16px 0 8px;letter-spacing:.04em}
.groups{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:8px}
.grp{text-align:left;padding:12px 13px 11px;border:1.5px solid var(--line);background:var(--card);border-radius:13px;position:relative}
.grp.on{border-color:var(--indigo);background:var(--indigo-soft)}
.grp .day{font-size:max(var(--min),calc(11px*var(--fs)));font-weight:700;color:var(--red)}
.grp b{display:block;font-size:max(var(--min),calc(14.5px*var(--fs)));margin:1px 0 2px}
.grp .words{font-size:max(var(--min),calc(12.5px*var(--fs)));color:var(--ink2)}
.grp{display:flex;flex-direction:column;align-items:stretch}
.grp .meter-row{display:flex;align-items:center;gap:10px;margin-top:auto;padding-top:12px}
.grp .meter{display:block;flex:1 1 auto;min-width:0;height:6px;border-radius:999px;background:var(--paper2);overflow:hidden}
.grp .meter i{display:block;height:100%;min-width:0;border-radius:999px;background:var(--green);transition:width .4s ease}
.grp .meter-v{flex:none;min-width:3ch;text-align:right;font-size:max(var(--min),calc(11.5px*var(--fs)));font-weight:700;color:var(--ink3);font-variant-numeric:tabular-nums}
.grp.on .meter{background:rgba(45,62,107,.14)}
.grp .chk{position:absolute;top:10px;right:11px;width:18px;height:18px;border-radius:50%;border:1.5px solid var(--line);display:grid;place-items:center;font-size:max(var(--min),calc(11px*var(--fs)));color:#fff}
.grp.on .chk{background:var(--indigo);border-color:var(--indigo)}
.sel-bar{display:flex;gap:8px;flex-wrap:wrap;margin-top:6px}
.chipbtn{border:1px solid var(--line);background:var(--card);border-radius:999px;padding:6px 12px;font-size:max(var(--min),calc(12.5px*var(--fs)));font-weight:500}
.startbar{position:sticky;bottom:76px;margin-top:18px;display:flex;gap:8px}
.startbar .btn{flex:1;box-shadow:var(--shadow)}

/* quiz */
.qhead{display:flex;align-items:center;gap:12px;padding:16px 0 10px}
.qclose{border:0;background:none;font-size:max(var(--min),calc(22px*var(--fs)));color:var(--ink3);padding:0 4px}
.prog{flex:1;height:10px;border-radius:10px;background:var(--paper2);overflow:hidden}
.prog i{display:block;height:100%;background:var(--green);border-radius:10px;transition:width .3s}
.combo{font-weight:900;color:var(--gold);font-size:max(var(--min),calc(14px*var(--fs)));min-width:54px;text-align:right}
.qtype{font-size:max(var(--min),calc(12.5px*var(--fs)));font-weight:700;color:var(--indigo);margin:8px 0 6px}
.qcard{padding:26px 20px;text-align:center;min-height:170px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px}
.qbig{font-size:calc(clamp(38px,11vw,56px)*var(--fs));font-weight:700;line-height:1.15}
.qmid{font-size:calc(clamp(22px,6vw,28px)*var(--fs));font-weight:700;line-height:1.35}
.qread{font-size:max(var(--min),calc(15px*var(--fs)));color:var(--ink3)}
.qhint{font-size:max(var(--min),calc(14px*var(--fs)));color:var(--ink2)}
.blank{display:inline-block;min-width:2.6em;border-bottom:3px solid var(--red);margin:0 .1em}
.speak{border:1px solid var(--line);background:var(--paper);border-radius:999px;padding:7px 14px;font-size:max(var(--min),calc(13px*var(--fs)));font-weight:700;margin-top:6px}
.speak.big{font-size:max(var(--min),calc(16px*var(--fs)));padding:14px 22px}
.opts{display:grid;gap:9px;margin-top:14px}
.opt{display:flex;align-items:center;gap:12px;text-align:left;padding:14px 15px;border:1.5px solid var(--line);background:var(--card);border-radius:14px;font-size:max(var(--min),calc(16px*var(--fs)));min-height:56px;transition:border-color .12s,background .12s}
.opt .k{flex:none;width:24px;height:24px;border-radius:7px;border:1px solid var(--line);display:grid;place-items:center;font-size:max(var(--min),calc(12px*var(--fs)));color:var(--ink3);font-weight:700}
.opt .sub{display:block;font-size:max(var(--min),calc(12.5px*var(--fs)));color:var(--ink3)}
.opt:hover:not(:disabled){border-color:var(--ink3)}
.opt.right{border-color:var(--green);background:var(--green-soft)}
.opt.wrong{border-color:var(--red);background:var(--red-soft);animation:shake .3s}
.opt:disabled{cursor:default}
@keyframes shake{25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}
.feedback{margin-top:14px;padding:16px;border-radius:14px;border:1.5px solid}
.feedback.ok{border-color:var(--green);background:var(--green-soft)}
.feedback.no{border-color:var(--red);background:var(--red-soft)}
.feedback .verdict{font-weight:900;font-size:max(var(--min),calc(16px*var(--fs)))}
.feedback .verdict.ok{color:var(--green)} .feedback .verdict.no{color:var(--red)}
.fb-s{font-size:max(var(--min),calc(19px*var(--fs)));font-weight:700;margin-top:8px}
.fb-p{font-size:max(var(--min),calc(13.5px*var(--fs)));color:var(--ink2)}
.fb-t{font-size:max(var(--min),calc(14.5px*var(--fs)));margin-top:2px}
.fb-w{font-size:max(var(--min),calc(13px*var(--fs)));color:var(--ink2);margin-top:6px}
.tally{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.tally span{font-size:max(var(--min),calc(12px*var(--fs)));background:var(--card);border:1px solid var(--line);border-radius:999px;padding:4px 10px}
.tally b{font-weight:900}
.nextbar{margin-top:14px;display:flex}
.nextbar .btn{flex:1}

/* result */
.result{text-align:center;padding:30px 20px}
.result .score{font-size:max(var(--min),calc(64px*var(--fs)));font-weight:900;letter-spacing:-.04em;line-height:1}
.result .score small{font-size:max(var(--min),calc(24px*var(--fs)));color:var(--ink3)}
.stamp{display:inline-block;margin:6px 0 4px;font-family:"Noto Serif JP",serif;font-weight:900;color:var(--red);border:3px solid var(--red);border-radius:8px;padding:2px 12px;transform:rotate(-4deg);font-size:max(var(--min),calc(22px*var(--fs)))}
.wlist{margin-top:16px;text-align:left}
.witem{padding:12px 14px;border-bottom:1px solid var(--line);display:flex;gap:10px;align-items:center}
.witem:last-child{border:0}

/* study */
.study-item{padding:14px 15px;border-bottom:1px solid var(--line)}
.study-item:last-child{border:0}
.si-top{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap}
.si-word{font-size:max(var(--min),calc(21px*var(--fs)));font-weight:700}
.si-read{font-size:max(var(--min),calc(13px*var(--fs)));color:var(--ink3)}
.si-mean{font-size:max(var(--min),calc(14px*var(--fs)));font-weight:700;color:var(--indigo)}
.si-s{font-size:max(var(--min),calc(16.5px*var(--fs)));margin-top:6px}
.si-sp{font-size:max(var(--min),calc(13px*var(--fs)));color:var(--ink2)}
.mini{border:1px solid var(--line);background:var(--paper);border-radius:8px;padding:2px 8px;font-size:max(var(--min),calc(12px*var(--fs)));margin-left:auto}
.groupsel{display:flex;gap:6px;overflow-x:auto;padding:4px 0 10px;scrollbar-width:none}
.groupsel::-webkit-scrollbar{display:none}
.groupsel button{flex:none;border:1px solid var(--line);background:var(--card);border-radius:999px;padding:7px 12px;font-size:max(var(--min),calc(13px*var(--fs)));font-weight:500;white-space:nowrap}
.groupsel button.on{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.flash{padding:30px 20px;text-align:center;min-height:240px;display:flex;flex-direction:column;justify-content:center;align-items:center;gap:8px;cursor:pointer;user-select:none}
.toggle-view{display:flex;justify-content:flex-end;gap:6px;margin-bottom:8px}

/* stats table */
.tbl{width:100%;border-collapse:collapse;font-size:max(var(--min),calc(13.5px*var(--fs)))}
.tbl th{text-align:left;font-size:max(var(--min),calc(11.5px*var(--fs)));color:var(--ink3);font-weight:700;padding:10px 8px;border-bottom:1px solid var(--line);white-space:nowrap;cursor:pointer}
.tbl td{padding:10px 8px;border-bottom:1px solid var(--line);vertical-align:middle}
.tbl tr:last-child td{border:0}
.tbl .num{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.bar{height:6px;border-radius:6px;background:var(--paper2);overflow:hidden;min-width:50px}
.bar i{display:block;height:100%;background:var(--red)}
.rate-hi{color:var(--red);font-weight:700}
.tbl-wrap{overflow-x:auto}
.tabs-inline{display:flex;gap:6px;margin:10px 0}

/* ranking */
.rank{display:flex;align-items:center;gap:12px;padding:13px 15px;border-bottom:1px solid var(--line)}
.rank:last-child{border:0}
.rank .n{width:26px;font-weight:900;font-size:max(var(--min),calc(16px*var(--fs)));color:var(--ink3);text-align:center}
.rank.me{background:var(--indigo-soft)}
.rank .nm{flex:1;font-weight:700}
.rank .acc{font-size:max(var(--min),calc(12px*var(--fs)));color:var(--ink3)}

/* modal */
.modal{position:fixed;inset:0;z-index:50;background:rgba(20,16,12,.45);display:grid;place-items:center;padding:16px}
.modal .box{width:100%;max-width:400px;padding:24px}
.modal input{width:100%;font:inherit;font-size:max(var(--min),calc(16px*var(--fs)));padding:13px 14px;border-radius:12px;border:1.5px solid var(--line);background:var(--paper);color:var(--ink);margin:14px 0 12px}
.modal input:focus{outline:none;border-color:var(--red)}
.toast{position:fixed;left:50%;bottom:88px;transform:translateX(-50%);background:var(--ink);color:var(--paper);padding:9px 16px;border-radius:999px;font-size:max(var(--min),calc(13px*var(--fs)));font-weight:500;z-index:60;opacity:0;transition:opacity .2s;pointer-events:none}
.toast.show{opacity:1}
.hidden{display:none!important}
.empty{padding:30px 16px;text-align:center;color:var(--ink3);font-size:max(var(--min),calc(14px*var(--fs)))}
footer{text-align:center;font-size:max(var(--min),calc(11.5px*var(--fs)));color:var(--ink3);padding:30px 0 10px}
/* ── 휴대폰: 글자 크게 ── */
/* ═════ 모바일 화면 (html.m) — 여백 최소, 화면 꽉 차게, 글자 최대 ═════ */
html{touch-action:pan-x pan-y;}
button,a,input{touch-action:manipulation}
html{-webkit-text-size-adjust:100%;text-size-adjust:100%}
html.m{--fs:calc(1.6*var(--u)); --min:calc(20px*var(--u)); --r:10px}
html.m body{line-height:1.5;padding-bottom:calc(88px + env(safe-area-inset-bottom))}
html.m .wrap{max-width:none;padding:0 2px}
html.m header.top .wrap{height:64px;gap:4px;padding:0 4px}
html.m .sun{width:24px;height:24px;box-shadow:0 0 0 3px var(--red-soft)}
html.m .brand{font-size:22px;gap:6px}
html.m .brand small,html.m .brand .serif{display:none}
html.m .brand{padding:10px 6px}
html.m #nextBtn{scroll-margin-bottom:calc(100px + env(safe-area-inset-bottom))}
html.m .spacer{flex:0 0 0}
html.m .pill{flex:1 1 auto;justify-content:center;padding:6px 8px;max-width:none;font-size:18px;gap:5px}
html.m #userName{min-width:1.5em;max-width:none;flex:0 1 auto}
html.m .seg button{padding:8px 10px;font-size:18px}
html.m nav.tabs .wrap{height:84px;padding:0}
html.m nav.tabs button{gap:4px}
html.m nav.tabs button .ic{font-size:30px}
html.m .hero{padding:10px 4px 2px}
html.m .hero p{margin-top:6px}
html.m .section-t{margin:16px 4px 6px;flex-wrap:wrap;gap:2px 10px}
html.m .stage-label{margin:12px 4px 6px}
html.m .kpis{gap:3px;margin-top:10px}
html.m .kpi{padding:10px 8px}
html.m .modes,html.m .groups{grid-template-columns:1fr;gap:3px}
html.m .mode,html.m .grp{padding:14px 12px;border-radius:var(--r)}
html.m .grp .chk{width:26px;height:26px;font-size:16px;top:12px;right:12px}
html.m .grp .meter{height:8px}
html.m .grp .meter-row{padding-top:14px}
html.m .sel-bar{gap:3px;margin:4px 0}
html.m .chipbtn{flex:1;padding:10px 8px}
html.m .startbar{bottom:calc(90px + env(safe-area-inset-bottom));gap:3px;margin-top:10px}
html.m .startbar .btn,html.m .btn{padding:16px 10px;border-radius:var(--r)}
html.m .qhead{padding:6px 2px 4px;gap:8px}
html.m .qclose{font-size:32px}
html.m .prog{height:14px}
html.m .combo{min-width:60px}
html.m .qtype{margin:6px 4px 4px}
html.m .qcard{padding:22px 8px;min-height:190px;border-radius:var(--r)}
html.m .qbig{font-size:calc(clamp(38px,13vw,72px)*1.15*var(--u))}
html.m .qmid{font-size:calc(clamp(22px,7vw,32px)*1.2*var(--u))}
html.m .speak{padding:10px 18px}
html.m .speak.big{padding:18px 28px}
html.m .opts{gap:4px;margin-top:8px}
html.m .opt{padding:16px 10px;min-height:76px;gap:10px;border-radius:var(--r);border-width:2px}
html.m .opt .k{width:34px;height:34px;font-size:18px}
html.m .feedback{margin-top:6px;padding:14px 10px;border-radius:var(--r)}
html.m .tally span{padding:6px 10px}
html.m .nextbar{margin-top:6px}
html.m .card{border-radius:var(--r)}
html.m .result{padding:24px 8px}
html.m .witem{padding:12px 8px}
html.m .study-item{padding:14px 10px}
html.m .groupsel{padding:2px 2px 8px}
html.m .groupsel button{padding:10px 14px}
html.m .flash{padding:26px 10px;min-height:300px}
html.m .row{gap:3px}
html.m .mini{padding:5px 12px}
html.m .tbl th,html.m .tbl td{padding:12px 5px}
html.m .tbl td:last-child,html.m .tbl th:last-child,html.m .tbl td:first-child,html.m .tbl th:first-child{display:none}
html.m .rank{padding:14px 10px}
html.m .modal{padding:4px}
html.m .modal .box{padding:22px 14px}
html.m .modal input{font-size:22px;padding:16px 14px}
html.m .toast{bottom:calc(100px + env(safe-area-inset-bottom));font-size:18px}
html.m footer{padding:24px 6px 10px}
</style>
</head>

<header class="top"><div class="wrap">
  <div class="brand" onclick="go('home')"><span class="sun"></span><span class="serif">にほんご 75</span><small data-i="tagline"></small></div>
  <div class="spacer"></div>
  <span class="pill" id="userPill" onclick="openNick()" title=""><span class="sync-dot" id="syncDot"></span><span id="userName">-</span><span class="xp" id="userXp" style="flex:none">0</span></span>
  <div class="seg" role="group" aria-label="Language">
    <button id="fsBtn" onclick="cycleFs()" title="글자 크기" aria-label="글자 크기">가</button><button id="langKo" onclick="setLang('ko')">KO</button><button id="langEn" onclick="setLang('en')">EN</button>
  </div>
</div></header>

<main class="wrap" id="app"></main>

<nav class="tabs"><div class="wrap">
  <button data-tab="home" onclick="go('home')"><span class="ic">◎</span><span data-i="tabHome"></span></button>
  <button data-tab="study" onclick="go('study')"><span class="ic">あ</span><span data-i="tabStudy"></span></button>
  <button data-tab="stats" onclick="go('stats')"><span class="ic">▤</span><span data-i="tabStats"></span></button>
  <button data-tab="rank" onclick="go('rank')"><span class="ic">♛</span><span data-i="tabRank"></span></button>
</div></nav>

<div class="modal hidden" id="nickModal"><div class="box card">
  <h2 style="font-size:max(var(--min),calc(20px*var(--fs)))" data-i="nickTitle"></h2>
  <p class="muted" style="margin:6px 0 0;font-size:max(var(--min),calc(14px*var(--fs)))" data-i="nickDesc"></p>
  <input id="nickInput" maxlength="20" autocomplete="nickname">
  <button class="btn red" style="width:100%" onclick="saveNick()" data-i="nickSave"></button>
</div></div>
<div class="toast" id="toast"></div>

<script src="app.js"></script>
